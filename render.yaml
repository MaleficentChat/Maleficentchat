services:
  - type: web
    name: maleficent-chat
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: maleficent-chat-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: SESSION_SECRET
        generateValue: true
      - key: PERSISTENT_DATA_DIR
        value: /opt/render/project/src/data
      - key: OWNER_USERNAME
        value: Maleficent
      - key: OWNER_PASSWORD
        sync: false
      - key: OWNER_DISPLAY_NAME
        value: Maleficent
