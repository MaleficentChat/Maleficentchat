name: News UI syntax validation

on:
  pull_request:
    branches: [main]

jobs:
  news-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check changed News JavaScript
        run: node --check public/app.js && node --check server.js
